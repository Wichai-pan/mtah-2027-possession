[project]
name = "mtah"
version = "0.1.0"
description = "Frame-level team possession for More than a Hack 2027"
authors = [
    { name = "Wichai_Huatai_Pan", email = "wichai_pan@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lxml>=6.1.3",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
viz = [
    "opencv-python-headless>=5.0.0.93",
]
